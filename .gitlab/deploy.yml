stages:
  - setup
  - check
  - build
  - deploy

include:
  - local: 'base.yml'

deploy:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "production"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  pages:
    publish: public
  dependencies:
    - build
  script:
    - mv site public # GitLab Pages requires the folder name to be 'public'
    - |
      echo "Site deployed"
      echo "  commit Hash: $CI_COMMIT_SHA"
      echo "  completion time: $(date +'%Y-%m-%dT%H:%M:%S')"
