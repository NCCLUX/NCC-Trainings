load_env:
  stage: setup
  image: alpine:latest
  script:
    - echo "PYTHON_VERSION=$(cat .python)" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env

.python_setup:
  image: python:${PYTHON_VERSION} # Automatically injected from variables.env
  dependency: load_env

check:
  stage: check
  image: !reference [.python_setup, image]
  dependencies:
    - !reference [.python_setup, dependency]
  cache:
    key: requirements-pip-cache
    paths:
      - .cache/requirements-pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/requirements-pip"
  script:
    - python -m pip install --upgrade pip
    - pip install --cache-dir .cache/requirements-pip --requirement config/requirements.txt
    - yamllint --config-file config/yamllint.yml properdocs.yml
    - pymarkdown --config config/pymarkdown.yml --strict-config scan --recurse docs

build:
  stage: build # properdocs setup requires git -> non-slim python container
  image: !reference [.python_setup, image]
  dependencies:
    - !reference [.python_setup, dependency]
    - check
  cache:
    key: pip-cache
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  script:
    - python -m pip install --upgrade pip
    - pip install --cache-dir .cache/pip --requirement requirements.txt
    - properdocs --version
    - properdocs build --strict
  artifacts:
    paths:
      - site/
